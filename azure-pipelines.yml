# Azure DevOps Pipeline para Hazelcast Client no MicroK8s
# Pipeline para build e deploy apenas do cliente Hazelcast
pool:
  name: Arm64
  vmImage: 'ubuntu-22.04'

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/*
      - pom.xml
      - Dockerfile*
      - k8s/*

variables:

  
  # Configurações do Docker - CONFIGURE ESTAS VARIÁVEIS
  dockerRegistryServiceConnection: 'DockerConnection'  # Nome da service connection no Azure DevOps
  imageRepository: 'hazelcast/hazelcast'
  containerRegistry: 'DockerConnection'           # Substitua pelo seu ACR
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile.arm64'
  tag: '$(Build.BuildId)'
  
  # Configurações do Kubernetes - CONFIGURE ESTAS VARIÁVEIS  
  kubernetesServiceConnection: 'K8SOracleCloud'   # Nome da service connection no Azure DevOps
  namespace: 'hazelcast'
  
  # Configurações do Docker Hub Cleanup
  DOCKERHUB_USERNAME: 'hazelcast'
  DOCKERHUB_REPOSITORY: 'hazelcast'

stages:

- stage: Deploy
  displayName: 'Deploy to MicroK8s'
  dependsOn: Docker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployJob
    displayName: 'Deploy to Kubernetes'
    pool:
      name: Arm64
      vmImage: 'ubuntu-22.04'
    environment: 'microk8s-cluster'
    strategy:
      runOnce:
        deploy:
          steps:

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              kubernetesServiceConnection: K8SOracleCloud
              namespace:  '$(namespace)' 
              action: deploy
              enableKubectlCommand: true
              arguments: --insecure-skip-tls-verify
              manifests: |
                $(Build.SourcesDirectory)/k8s/hazelcast-services.yaml
                $(Build.SourcesDirectory)/k8s/hazelcast-certificate.yaml
                $(Build.SourcesDirectory)/k8s/hazelcast-ingress.yaml
                $(Build.SourcesDirectory)/k8s/hazelcast-member.yaml
                $(Build.SourcesDirectory)/k8s/hazelcast-secrets.yaml
              containers: 'manoelvsneto/hazelcast-client:latest'