apiVersion: v1
kind: ServiceAccount
metadata:
  name: hazelcast
  namespace: hazelcast
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hazelcast-discovery
  namespace: hazelcast
rules:
- apiGroups: [""]
  resources: ["endpoints", "pods", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hazelcast-discovery-binding
  namespace: hazelcast
subjects:
- kind: ServiceAccount
  name: hazelcast
  namespace: hazelcast
roleRef:
  kind: Role
  name: hazelcast-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: hazelcast-service
  namespace: hazelcast
  labels:
    app: hazelcast
spec:
  type: ClusterIP
  selector:
    app: hazelcast
  ports:
    - name: hazelcast
      port: 5701
      targetPort: 5701
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazelcast
  namespace: hazelcast
  labels:
    app: hazelcast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hazelcast
  template:
    metadata:
      labels:
        app: hazelcast
    spec:
      serviceAccountName: hazelcast
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - name: hazelcast
        image: hazelcast/hazelcast:5.5
        ports:
        - containerPort: 5701
          name: hazelcast
        env:
        - name: HZ_CLUSTERNAME
          value: dev
        - name: HZ_NETWORK_JOIN_KUBERNETES_ENABLED
          value: "true"
        - name: HZ_NETWORK_JOIN_KUBERNETES_NAMESPACE
          value: hazelcast
        - name: HZ_NETWORK_JOIN_KUBERNETES_SERVICENAME
          value: hazelcast-service
        readinessProbe:
          tcpSocket:
            port: 5701
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 5701
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hazelcast-mc-service
  namespace: hazelcast
  labels:
    app: hazelcast-mc
spec:
  type: ClusterIP
  selector:
    app: hazelcast-mc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazelcast-mc
  namespace: hazelcast
  labels:
    app: hazelcast-mc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hazelcast-mc
  template:
    metadata:
      labels:
        app: hazelcast-mc
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - name: management-center
        image: hazelcast/management-center:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MC_DEFAULT_CLUSTER
          value: dev
        - name: MC_DEFAULT_CLUSTER_MEMBERS
          value: hazelcast-service.hazelcast.svc.cluster.local:5701
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hazelcast-ingress
  namespace: hazelcast
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - hazelcast.archse.eng.br
    secretName: hazelcast-tls
  rules:
  - host: hazelcast.archse.eng.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hazelcast-mc-service
            port:
              number: 8080
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hazelcast-tls
  namespace: hazelcast
spec:
  secretName: hazelcast-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - hazelcast.archse.eng.br