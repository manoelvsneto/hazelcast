apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazelcast-mc
  namespace: hazelcast
  labels:
    app: hazelcast-mc
    component: management-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hazelcast-mc
      component: management-center
  template:
    metadata:
      labels:
        app: hazelcast-mc
        component: management-center
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - name: management-center
        image: hazelcast/management-center:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: MC_DEFAULT_CLUSTER
          value: dev
        - name: MC_DEFAULT_CLUSTER_MEMBERS
          value: hazelcast-service.hazelcast.svc.cluster.local:5701
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
