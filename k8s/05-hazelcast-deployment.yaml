apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazelcast
  namespace: hazelcast
  labels:
    app: hazelcast
    component: member
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hazelcast
      component: member
  template:
    metadata:
      labels:
        app: hazelcast
        component: member
    spec:
      serviceAccountName: hazelcast
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - name: hazelcast
        image: hazelcast/hazelcast:5.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5701
          name: hazelcast
          protocol: TCP
        env:
        - name: HZ_CLUSTERNAME
          value: dev
        - name: HZ_NETWORK_JOIN_KUBERNETES_ENABLED
          value: "true"
        - name: HZ_NETWORK_JOIN_KUBERNETES_NAMESPACE
          value: hazelcast
        - name: HZ_NETWORK_JOIN_KUBERNETES_SERVICENAME
          value: hazelcast-service
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          tcpSocket:
            port: 5701
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 5701
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
